name: android-apks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apks.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apks.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test and build both apps
        run: gradle -p apps/android test :customer-app:assembleDebug :staff-app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bank-qms-customer-apk
          path: apps/android/customer-app/build/outputs/apk/debug/customer-app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bank-qms-staff-apk
          path: apps/android/staff-app/build/outputs/apk/debug/staff-app-debug.apk
          if-no-files-found: error
