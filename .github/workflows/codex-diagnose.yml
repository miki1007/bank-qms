name: codex-diagnose-portfolio
on:
  push:
    branches:
      - codex/worldlink-full-stack

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bank_qms
          POSTGRES_USER: qms_user
          POSTGRES_PASSWORD: qms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qms_user -d bank_qms"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://qms_user:qms_password@localhost:5432/bank_qms
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      APP_ORIGIN: http://localhost:5173
      CUSTOMER_ORIGIN: http://localhost:5176
      KIOSK_ORIGIN: http://localhost:5174
      DISPLAY_ORIGIN: http://localhost:5175
      DEV_MANAGER_PASSWORD: CIManagerPassword2026
      DEV_ADMIN_PASSWORD: CIAdminPassword2026
      DEV_TELLER_PASSWORD: CITellerPassword2026
      KIOSK_DEVICE_SECRET: ci-kiosk-device-secret
      DISPLAY_DEVICE_SECRET: ci-display-device-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: NODE_ENV=development pnpm db:seed
      - run: pnpm --filter @qms/api dev > /tmp/qms-api.log 2>&1 &
      - run: bash scripts/wait-for-services.sh http://localhost:3000/health/ready
      - name: Call customer portfolio
        run: |
          curl --silent --show-error --fail-with-body             --request POST             --header "Content-Type: application/json"             --data '{"name":"Diagnostic Customer","email":"portfolio-diagnostic@example.test","password":"CustomerE2E2026"}'             http://localhost:3000/api/v1/customer-auth/register > /tmp/register.json
          TOKEN=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("/tmp/register.json","utf8")).accessToken)')
          curl --silent --show-error --fail-with-body             --header "Authorization: Bearer $TOKEN"             http://localhost:3000/api/v1/customers/me/portfolio
      - if: always()
        run: tail -n 160 /tmp/qms-api.log
