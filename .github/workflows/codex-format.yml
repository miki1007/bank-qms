name: codex-format-worldlink
on:
  push:
    branches:
      - codex/worldlink-full-stack

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/worldlink-full-stack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/operations/local-development.md \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/migrations/202609140001_customer_banking_portfolio/migration.sql \
            apps/api/src/app.module.ts \
            apps/api/src/modules/customer-banking.ts \
            apps/customer-web/index.html \
            apps/customer-web/vite.config.ts \
            apps/customer-web/src/main.tsx \
            apps/customer-web/src/customer.css \
            apps/staff-web/index.html \
            apps/staff-web/vite.config.ts \
            apps/staff-web/src/main.tsx \
            apps/staff-web/src/staff.css \
            apps/kiosk-web/index.html \
            apps/kiosk-web/vite.config.ts \
            apps/kiosk-web/src/main.tsx \
            apps/display-web/index.html \
            apps/display-web/vite.config.ts \
            apps/display-web/src/main.tsx \
            apps/display-web/src/display.css \
            packages/ui/src/index.tsx \
            packages/ui/src/theme.css \
            tests/e2e/bank-qms.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/operations/local-development.md apps packages/ui tests/e2e/bank-qms.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format WorldLink full-stack update"
            git push origin HEAD:codex/worldlink-full-stack
          fi
