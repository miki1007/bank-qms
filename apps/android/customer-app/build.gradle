plugins {
    id "com.android.application"
}

def bankQmsBaseUrl = providers.gradleProperty("bankQmsBaseUrl")
        .orElse("https://bank-qms.malikket.chatgpt.site")
        .get()

android {
    namespace "com.bankqms.customer"
    compileSdk 35

    defaultConfig {
        applicationId "com.bankqms.customer"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "START_URL", "\"${bankQmsBaseUrl}/customer-app\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(":shell")
}
