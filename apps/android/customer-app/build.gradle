plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def bankQmsApiUrl = providers.gradleProperty("bankQmsApiUrl")
        .orElse("http://10.0.2.2:3000/api/v1")
        .get()

android {
    namespace "com.bankqms.customer"
    compileSdk 35

    defaultConfig {
        applicationId "com.bankqms.customer"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.0.0"
        buildConfigField "String", "API_URL", "\"${bankQmsApiUrl}\""
        manifestPlaceholders = [usesCleartext: "true"]
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartext: "true"]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartext: "false"]
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(":mobile-core")
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
}
