name: BankQMS
options:
  bundleIdPrefix: com.bankqms
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  BankQMSCustomer:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Customer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bankqms.customer
        PRODUCT_NAME: Bank QMS Customer
        BANK_QMS_START_URL: https://bank-qms.malikket.chatgpt.site/customer-app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bank QMS Customer
        INFOPLIST_KEY_BankQMSStartURL: $(BANK_QMS_START_URL)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  BankQMSStaff:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Staff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bankqms.staff
        PRODUCT_NAME: Bank QMS Staff
        BANK_QMS_START_URL: https://bank-qms.malikket.chatgpt.site/staff-app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bank QMS Staff
        INFOPLIST_KEY_BankQMSStartURL: $(BANK_QMS_START_URL)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  BankQMSCustomer:
    build:
      targets:
        BankQMSCustomer: all
    run:
      config: Debug
  BankQMSStaff:
    build:
      targets:
        BankQMSStaff: all
    run:
      config: Debug
