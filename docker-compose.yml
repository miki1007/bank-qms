services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bank_qms
      POSTGRES_USER: qms_user
      POSTGRES_PASSWORD: qms_password
    ports:
      - "5432:5432"
    volumes:
      - qms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms_user -d bank_qms"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qms_user:qms_password@postgres:5432/bank_qms
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qms_postgres_data:
